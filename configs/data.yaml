# Data Configuration for RiskStream

# PaySim Dataset
paysim:
  raw_path: "data/raw/paysim/PS_20174392719_1491204439457_log.csv"
  interim_path: "data/interim/paysim_validated.parquet"
  processed_path: "data/processed/paysim_processed.parquet"
  
  schema:
    step: int64
    type: str
    amount: float64
    nameOrig: str
    oldbalanceOrg: float64
    newbalanceOrig: float64
    nameDest: str
    oldbalanceDest: float64
    newbalanceDest: float64
    isFraud: int64
    isFlaggedFraud: int64
  
  # Columns that may cause leakage
  potential_leakage_columns:
    - isFlaggedFraud  # Output of existing rule
    - oldbalanceDest  # May be unrealistic on fraud
    - newbalanceDest  # May be unrealistic on fraud
  
  # Chronological split (by step field, which represents hours)
  # PaySim has 743 steps total (~30 days)
  split:
    train_end_step: 595  # ~80% of data
    val_end_step: 669    # ~90% of data
    # test starts at 670 and goes to 743

# Synthetic data generation
synthetic:
  output_path: "data/synthetic/transactions.parquet"
  seed: 42
  num_transactions: 10000
  fraud_rate: 0.001  # 0.1% fraud rate
  transaction_types:
    - PAYMENT
    - TRANSFER
    - CASH_OUT
    - DEBIT
    - CASH_IN
  
  # Amount ranges (in currency units)
  amount_ranges:
    PAYMENT: [1.0, 10000.0]
    TRANSFER: [100.0, 500000.0]
    CASH_OUT: [1.0, 100000.0]
    DEBIT: [1.0, 5000.0]
    CASH_IN: [1.0, 50000.0]
  
  # Fraud patterns
  fraud_patterns:
    high_amount_transfer:
      type: TRANSFER
      min_amount: 200000.0
      probability: 0.7
    
    zero_balance_cashout:
      type: CASH_OUT
      balance_drain: true
      probability: 0.8

# Data quality thresholds
quality:
  max_missing_rate: 0.1  # Fail if any column has >10% missing
  min_fraud_rate: 0.0001  # Minimum expected fraud rate
  max_fraud_rate: 0.1     # Maximum expected fraud rate
  
  # Column-specific validation
  amount:
    min: 0.0
    max: 10000000.0  # 10M upper bound sanity check
  
  step:
    min: 1
    max: 10000  # Generous upper bound

# Output formats
output:
  parquet_compression: "snappy"
  parquet_row_group_size: 100000
