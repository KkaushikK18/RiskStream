# Data pipeline configuration.
# Paths are relative to the project root.

datasets:
  paysim:
    description: >-
      PaySim synthetic mobile-money simulation (Lopez-Rojas et al., 2016).
      Simulated data: results do not represent performance on real transactions.
    source_url: https://www.kaggle.com/datasets/ealaxi/paysim1
    raw_path: data/raw/paysim/PS_20174392719_1491204439457_log.csv
    interim_dir: data/interim/paysim
    processed_dir: data/processed/paysim
    eda_dir: reports/eda/paysim
    temporal_column: step
    temporal_resolution_hours: 1   # one step == one simulated hour
    # Chronological split on `step` (inclusive upper bounds).
    # PaySim volume collapses after ~step 400 while fraud stays roughly constant,
    # so these boundaries hold ~80% / 10% / 10% of FRAUD CASES but
    # ~98.1% / 0.8% / 1.1% of ROWS. See reports/eda/paysim/eda_summary.md.
    split:
      train_end_step: 595
      val_end_step: 669
    disclaimer: PaySim is a simulation. These results do not represent performance on real payment fraud.

  synthetic:
    description: >-
      Deterministic PaySim-format synthetic data for tests, CI and demos.
      Never use it to report model quality.
    raw_path: data/synthetic/transactions.parquet
    interim_dir: data/interim/synthetic
    processed_dir: data/processed/synthetic
    eda_dir: reports/eda/synthetic
    temporal_column: step
    temporal_resolution_hours: 1
    split:
      train_end_step: 160
      val_end_step: 200
    disclaimer: 'Synthetic generator data: these numbers only show the pipeline runs.'

  ieee_cis:
    description: >-
      IEEE-CIS Fraud Detection (Vesta Corporation, Kaggle 2019). Real, anonymized
      e-commerce card transactions. Only the labelled train_* files are used;
      test_* has no labels. Kaggle competition data: not redistributed.
    source_url: https://www.kaggle.com/competitions/ieee-fraud-detection
    raw_path: data/raw/ieee-cis/train_transaction.csv
    identity_path: data/raw/ieee-cis/train_identity.csv
    interim_dir: data/interim/ieee_cis
    processed_dir: data/processed/ieee_cis
    eda_dir: reports/eda/ieee_cis
    # TransactionDT is seconds from an undisclosed reference; its minimum is 86400.
    # day = (TransactionDT - 86400) // 86400, so days run 0..181.
    temporal_column: day
    # Inclusive upper bounds in days: ~70.7% / 14.2% / 15.1% of rows, fraud rate
    # 3.53% / 3.38% / 3.49% (measured 2026-11-23).
    split:
      train_end_day: 120
      val_end_day: 150
    disclaimer: >-
      IEEE-CIS is real but anonymized: column meanings are partly hidden, the costs
      in configs/thresholds.yaml are assumptions, and results apply to this dataset only.
synthetic_generator:
  seed: 42
  num_transactions: 50000
  num_steps: 240
  # Share of TRANSFER + CASH_OUT rows that are fraudulent.
  fraud_rate_in_risky_types: 0.01
  type_probabilities:
    CASH_OUT: 0.35
    PAYMENT: 0.34
    CASH_IN: 0.22
    TRANSFER: 0.08
    DEBIT: 0.01
  # Log-normal parameters (mean, sigma of the natural log of the amount).
  amount_lognormal:
    CASH_OUT: [11.5, 1.0]
    PAYMENT: [8.5, 1.0]
    CASH_IN: [11.3, 1.0]
    TRANSFER: [12.0, 1.3]
    DEBIT: [8.0, 1.0]
  balance_lognormal: [10.5, 1.8]
  # Account pool sizes relative to num_transactions.
  origin_pool_ratio: 0.9
  customer_dest_pool_ratio: 0.2
  merchant_dest_pool_ratio: 0.3
  mule_dest_pool_size: 60
  fraud_drains_balance_probability: 0.9
  fraud_uses_mule_probability: 0.7

quality:
  # Fail ingestion if more than this share of rows breaks a row-level rule.
  max_invalid_row_rate: 0.001
  amount_max: 100000000.0

eda:
  correlation_sample_rows: 500000
  sample_seed: 42
