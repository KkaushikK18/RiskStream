# Logging Configuration for RiskStream

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  
  standard:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/riskstream.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  riskstream:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  riskstream.data:
    level: DEBUG
  
  riskstream.features:
    level: DEBUG
  
  riskstream.models:
    level: DEBUG

root:
  level: INFO
  handlers: [console]
