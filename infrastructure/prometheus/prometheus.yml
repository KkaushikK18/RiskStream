# Prometheus scrape configuration for the local stack.
# Targets that are not running (e.g. the "app" profile is down) show as DOWN; that is expected.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: outbox-relay
    static_configs: [{targets: ["relay:9101"]}]
  - job_name: feature-consumer
    static_configs: [{targets: ["feature-consumer:9102"]}]
  - job_name: scoring-worker
    static_configs: [{targets: ["scoring-worker:9103"]}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
