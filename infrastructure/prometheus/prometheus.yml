# Prometheus scrape configuration for the local stack.
# Targets whose profile is not running (e.g. "app" is down) show as DOWN, and the
# ServiceDown (tier=app) / InfraExporterDown (tier=infra) alerts fire for them. That is intended.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"], labels: {tier: app}}]
  - job_name: outbox-relay
    static_configs: [{targets: ["relay:9101"], labels: {tier: app}}]
  - job_name: feature-consumer
    static_configs: [{targets: ["feature-consumer:9102"], labels: {tier: app}}]
  - job_name: scoring-worker
    static_configs: [{targets: ["scoring-worker:9103"], labels: {tier: app}}]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{targets: ["redpanda:9644"], labels: {tier: infra}}]
  - job_name: redis
    static_configs: [{targets: ["redis-exporter:9121"], labels: {tier: infra}}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"], labels: {tier: infra}}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"], labels: {tier: infra}}]
