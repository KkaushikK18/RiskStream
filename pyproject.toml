[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskstream"
version = "0.1.0"
description = "Real-time fraud detection and risk scoring platform (traditional ML)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Runtime dependency ranges. Exact versions: requirements-lock.txt.
dependencies = [
    "numpy>=2.3",
    "polars>=1.30",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "scikit-learn>=1.7",
    "lightgbm>=4.6",
    "xgboost>=3.0",
    "joblib>=1.5",
    "mlflow>=3.4",
    "matplotlib>=3.10",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "confluent-kafka>=2.6",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=7.0", "ruff>=0.13", "httpx>=0.28"]

[project.scripts]
riskstream = "riskstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["venv", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are evaluated once at import time by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Query", "fastapi.Path",
                          "riskstream.api.dependencies.require_role"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that train models or take more than a few seconds",
    "paysim: tests that need the real PaySim file (skipped when absent)",
    "postgres: tests that need RISKSTREAM_TEST_DATABASE_URL (skipped when unset)",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
    "ignore::UserWarning:lightgbm.*",
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
]
