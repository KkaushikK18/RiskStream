# RiskStream local environment.
#
# Profiles (start only what you need; the laptop has little free RAM):
#   (none)          postgres, redis, redpanda              infrastructure only
#   app             + migrate, api, relay, feature-consumer, scoring-worker
#   observability   + prometheus, grafana
#   mlflow          + mlflow tracking server / model registry
#
#   docker compose build
#   docker compose --profile app up -d
#   docker compose --profile app --profile observability --profile mlflow up -d
#   docker compose --profile app --profile observability --profile mlflow ps
#   docker compose --profile "*" down        # stop everything (volumes kept)
#   docker compose --profile "*" down -v     # stop and DELETE all data volumes
#
# Every value in ${...} comes from .env. Ports are bound to 127.0.0.1 only.

name: riskstream

x-app: &app
  image: riskstream:${RISKSTREAM_IMAGE_TAG:-local}
  build: .
  init: true
  restart: unless-stopped
  stop_grace_period: 20s
  volumes:
    - ./models:/app/models:ro
  environment: &app-env
    ENVIRONMENT: docker
    LOG_FORMAT: json
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://riskstream_app:${RISKSTREAM_APP_PASSWORD}@postgres:5432/riskstream
    MIGRATION_DATABASE_URL: postgresql+psycopg://riskstream_owner:${RISKSTREAM_OWNER_PASSWORD}@postgres:5432/riskstream
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    API_BASE_URL: http://api:8000
    METRICS_HOST: 0.0.0.0
    MODEL_BUNDLE_PATH: ${MODEL_BUNDLE_PATH}
    POLICY_PATH: ${POLICY_PATH}
    MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  postgres:
    # 16 is used because it was already cached locally; the schema needs nothing newer.
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      RISKSTREAM_OWNER_PASSWORD: ${RISKSTREAM_OWNER_PASSWORD:?set RISKSTREAM_OWNER_PASSWORD in .env}
      RISKSTREAM_APP_PASSWORD: ${RISKSTREAM_APP_PASSWORD:?set RISKSTREAM_APP_PASSWORD in .env}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=100, -c, log_min_duration_statement=250]
    ports: ["127.0.0.1:5433:5432"]   # 5433 avoids a locally installed PostgreSQL on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/roles.sql:/riskstream/roles.sql:ro
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskstream"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: {resources: {limits: {memory: 768m}}}
    restart: unless-stopped

  # Online feature store. No persistence: it is rebuilt from PostgreSQL by the
  # feature-consumer container on start (online-bootstrap --if-needed).
  # noeviction: when memory is full, writes fail loudly instead of features vanishing.
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", --maxmemory, 640mb,
              --maxmemory-policy, noeviction, --save, "", --appendonly, "no",
              --hash-max-listpack-entries, "512", --hash-max-listpack-value, "64"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy: {resources: {limits: {memory: 768m}}}
    restart: unless-stopped

  # Kafka-compatible broker, single node, dev mode. Internal listener redpanda:9092
  # for containers, external 127.0.0.1:19092 for host tools (replay, tests).
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.20
    command: [redpanda, start, --mode, dev-container, --smp, "1", --memory, 512M, --reserve-memory, 0M,
              --overprovisioned,
              --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092",
              --advertise-kafka-addr, "internal://redpanda:9092,external://127.0.0.1:19092"]
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:9644:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy: {resources: {limits: {memory: 768m}}}
    restart: unless-stopped

  # ------------------------------------------------------------------ app

  # One-shot: schema migrations and topic creation, then exit 0.
  migrate:
    <<: *app
    profiles: [app]
    restart: "no"
    command: ["sh", "-c", "python -m riskstream.cli db-upgrade && python -m riskstream.cli topics-create"]
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 384m}}}

  api:
    <<: *app
    profiles: [app]
    environment:
      <<: *app-env
      INSTANCE_ID: api-1
      API_KEYS: ${API_KEYS}
    command: ["python", "-m", "riskstream.cli", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      # liveness only: readiness (model + database) is /health/ready, used by load balancers
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy: {resources: {limits: {memory: 768m}}}

  relay:
    <<: *app
    profiles: [app]
    environment: {<<: *app-env, INSTANCE_ID: relay-1, METRICS_PORT: "9101"}
    command: ["python", "-m", "riskstream.cli", "run-relay", "--metrics-port", "9101"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck: &metrics-health
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['METRICS_PORT'] + '/metrics', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy: {resources: {limits: {memory: 384m}}}

  # Rebuilds Redis from PostgreSQL when it is empty (first start, Redis restart),
  # then consumes. If Redis is wiped while running, the consumer exits (code 3)
  # and the restart policy re-runs this sequence; offsets are already committed.
  feature-consumer:
    <<: *app
    profiles: [app]
    environment: {<<: *app-env, INSTANCE_ID: feature-consumer-1, METRICS_PORT: "9102"}
    command: ["sh", "-c", "python -m riskstream.cli online-bootstrap --if-needed && exec python -m riskstream.cli run-feature-consumer --metrics-port 9102 --exit-on-store-lost"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *metrics-health
      start_period: 600s   # a full bootstrap of 6.26M rows takes ~2 min; headroom for slower machines
    # bootstrap runs in this container; its working set needs the headroom
    deploy: {resources: {limits: {memory: 1536m}}}

  scoring-worker:
    <<: *app
    profiles: [app]
    environment: {<<: *app-env, INSTANCE_ID: scoring-worker-1, METRICS_PORT: "9103", WORKER_API_KEY: "${WORKER_API_KEY}"}
    command: ["python", "-m", "riskstream.cli", "run-scoring-worker", "--metrics-port", "9103"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck: *metrics-health
    deploy: {resources: {limits: {memory: 384m}}}

  # ------------------------------------------------------------------ mlflow

  # Tracking server + model registry. Backend: PostgreSQL database "mlflow".
  # Artifacts: proxied by the server (--serve-artifacts) into the mlartifacts volume,
  # so clients never need filesystem access to it.
  mlflow:
    <<: *app
    profiles: [mlflow]
    volumes: [mlartifacts:/mlartifacts]
    environment:
      # MLflow's server-side job runner (GenAI evaluation jobs) starts ~9 extra Python
      # processes (~0.8 GB). RiskStream does not use it; with it enabled the container
      # was OOM-killed at a 1 GB limit.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_DISABLE_AGENT_HINT: "1"
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1",
              "--backend-store-uri", "postgresql+psycopg://riskstream_owner:${RISKSTREAM_OWNER_PASSWORD}@postgres:5432/mlflow",
              "--artifacts-destination", "/mlartifacts", "--serve-artifacts",
              "--allowed-hosts", "localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000"]
    ports: ["127.0.0.1:5000:5000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy: {resources: {limits: {memory: 768m}}}

  # ------------------------------------------------------------------ observability

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus,
              --storage.tsdb.retention.time=7d, --web.enable-lifecycle]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy: {resources: {limits: {memory: 384m}}}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy: {resources: {limits: {memory: 384m}}}
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
  mlartifacts:
  prometheus:
  grafana:
