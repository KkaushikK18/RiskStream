# Local infrastructure: PostgreSQL (Phase 3), Redis and Redpanda (Phase 4).
# Phase 5 adds the API and workers as containers, MLflow, Prometheus and Grafana.
#
#   docker compose up -d postgres redis redpanda
#   docker compose ps          # wait for "healthy"
#   docker compose down        # stop (data kept in the volume)
#   docker compose down -v     # stop and DELETE the database volume
#
# Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432.

name: riskstream

services:
  postgres:
    # 16 is used because it was already cached locally; the schema needs nothing newer.
    image: postgres:${POSTGRES_IMAGE_TAG:-16-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      RISKSTREAM_OWNER_PASSWORD: ${RISKSTREAM_OWNER_PASSWORD:?set RISKSTREAM_OWNER_PASSWORD in .env}
      RISKSTREAM_APP_PASSWORD: ${RISKSTREAM_APP_PASSWORD:?set RISKSTREAM_APP_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=250
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/roles.sql:/riskstream/roles.sql:ro
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d riskstream"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  # Online feature store. No persistence: the store is rebuilt from PostgreSQL
  # (`online-bootstrap`). noeviction: when memory is full, writes fail loudly
  # (the consumer blocks and alerts) instead of Redis silently dropping features.
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --maxmemory
      - 640mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
      - --appendonly
      - "no"
      - --hash-max-listpack-entries
      - "512"
      - --hash-max-listpack-value
      - "64"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

  # Kafka-compatible broker, single node, dev mode (no fsync per write).
  # Internal listener redpanda:9092 for containers (Phase 5), external 127.0.0.1:19092 for the host.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.20
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644"   # admin API / broker metrics
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 768m
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
